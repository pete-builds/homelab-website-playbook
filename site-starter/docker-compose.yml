# {{DOMAIN}}: nginx serving the built site on the server's LOOPBACK only.
# The Cloudflare tunnel (a separate compose project) is the only way in.
#
# 127.0.0.1 is not optional. Docker writes its own firewall rules, so a port
# published on 0.0.0.0 is reachable even when ufw says it's blocked.
services:
  site:
    build:
      context: .
      args:
        BUILD_ID: ${BUILD_ID:-dev}
    image: {{SITE_NAME}}-site:latest
    container_name: {{SITE_NAME}}
    restart: unless-stopped
    ports:
      - '127.0.0.1:{{SITE_PORT}}:80'
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    security_opt:
      - 'no-new-privileges:true'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
