server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # ── Security headers, at SERVER level only ─────────────────────────────────
  # nginx does not merge add_header across levels: a location with its own
  # add_header DISCARDS every add_header inherited from here. That has silently
  # stripped all of these from a home page before. So: no add_header in any
  # location below. Cache policy uses `expires`, which doesn't reset them.
  # scripts/verify-site.sh fails a deploy that loses any of the four.
  #
  # static.cloudflareinsights.com: Cloudflare Web Analytics INJECTS its beacon
  # into proxied HTML at the edge. Without these two entries every visitor's
  # console logs a CSP violation. Turn off Web Analytics' automatic setup and
  # you can delete them.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.cloudflareinsights.com; connect-src 'self' https://cloudflareinsights.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

  # NOT a single-page-app fallback. If index.html answered every unknown path,
  # a missing image would come back 200 as text/html and every check would
  # pass against nothing.
  location / {
    try_files $uri $uri/ =404;
  }
  error_page 404 /404.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Astro fingerprints everything under /assets/: the filename changes when the
  # content does, so a year-long cache is safe.
  location /assets/ {
    expires 1y;
  }

  # HTML must never be cached, or visitors (and Cloudflare) keep the old page
  # after a deploy. `expires -1` sends Cache-Control: no-cache.
  location ~* \.html$ {
    expires -1;
  }
  location = / {
    expires -1;
    try_files /index.html =404;
  }

  # Adding a MIME type? Use default_type inside a location. A server-level
  # `types { }` block REPLACES nginx's whole map and your HTML starts
  # downloading as application/octet-stream.

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
}
