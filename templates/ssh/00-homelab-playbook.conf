# Managed by homelab-website-playbook (scripts/server/10-harden-ssh.sh).
#
# The file is named 00-* on purpose. sshd keeps the FIRST value it reads for
# each setting and reads sshd_config.d/*.conf in name order, so a file named
# 99-* loses to the 50-cloud-init.conf many images ship with
# "PasswordAuthentication yes". Verify the effective result with: sudo sshd -T
#
# Every value is set explicitly. A commented-out default is not a control.

Port {{SSH_PORT}}
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
AllowUsers {{ADMIN_USER}}
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
ClientAliveInterval 300
ClientAliveCountMax 2
